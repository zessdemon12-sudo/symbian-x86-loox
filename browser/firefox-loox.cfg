// Firefox Low-Memory Configuration for Symbian-X86 LOOX OS
// Target: Fujitsu FMV-BIBLO LOOX M/G30 (1GB DDR2 RAM, Atom N450)

// Memory Cache Capping (32MB RAM max)
pref("browser.cache.memory.capacity", 32768);
pref("browser.cache.memory.max_entry_size", 4096);
pref("browser.sessionhistory.max_entries", 3);
pref("browser.sessionhistory.max_total_viewers", 1);

// Multiprocess Memory Conservation: Limit web processes to 1 to prevent OOM
pref("dom.ipc.processCount", 1);
pref("dom.ipc.processCount.webIsolated", 1);
pref("browser.tabs.remote.separatePrivilegedMozillaWebContentProcess", false);

// Graphics & Performance (Intel GMA 3150 compatible)
pref("layers.acceleration.force-enabled", true);
pref("media.hardware-video-decoding.enabled", true);
pref("gfx.webrender.software", true);

// Eliminate background telemetry and pinging CPU cycles
pref("toolkit.telemetry.enabled", false);
pref("toolkit.telemetry.unified", false);
pref("browser.ping-centre.telemetry", false);
pref("experiments.activeExperiment", false);
pref("experiments.supported", false);
pref("network.prefetch-next", false);
pref("network.dns.disablePrefetch", true);
