# GRUB 2 Configuration for Symbian-X86 LOOX OS
# Optimized for Fujitsu FMV-BIBLO LOOX M/G30

set default="0"
set timeout=5

# Display & Text Console Fallback for Netbooks
insmod all_video
insmod vbe
insmod vga
insmod gfxterm
insmod part_msdos
insmod ext2
insmod iso9660

# Use text and graphic console simultaneously for bulletproof video
terminal_output console gfxterm 2>/dev/null || terminal_output console

# Colors
set menu_color_normal=light-cyan/black
set menu_color_highlight=white/blue

# Standard Kernel Command Line for LOOX M/G30
set loox_cmdline="boot=live quiet splash elevator=deadline intel_idle.max_cstate=4 pcie_aspm=force mitigations=auto,nosmt zswap.enabled=0"

menuentry "Symbian-X86 LOOX OS (Live Desktop)" --class symbian --class os {
    linux /boot/vmlinuz ${loox_cmdline}
    initrd /boot/initrd.img
}

menuentry "Symbian-X86 LOOX OS (Safe Graphics - nomodeset)" --class symbian --class os {
    linux /boot/vmlinuz boot=live nomodeset vga=791 elevator=deadline mitigations=auto,nosmt
    initrd /boot/initrd.img
}

menuentry "Install Symbian-X86 LOOX OS to Internal HDD" --class install --class os {
    linux /boot/vmlinuz boot=live symbian_installer=1 elevator=deadline mitigations=auto,nosmt
    initrd /boot/initrd.img
}

menuentry "Symbian-X86 LOOX OS (Verbose Debug Mode)" --class debug {
    linux /boot/vmlinuz boot=live verbose debug
    initrd /boot/initrd.img
}

menuentry "Reboot System" {
    reboot
}

menuentry "Power Off" {
    halt
}
