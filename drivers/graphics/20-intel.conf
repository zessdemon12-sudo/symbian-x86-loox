# X.Org Driver Configuration for Intel GMA 3150
# Hardware: Fujitsu FMV-BIBLO LOOX M/G30 (Atom N450 / NM10)

Section "Device"
    Identifier  "Intel GMA 3150"
    Driver      "modesetting"
    Option      "AccelMethod"     "glamor"
    Option      "TearFree"        "true"
    Option      "DRI"             "2"
    Option      "Backlight"       "intel_backlight"
EndSection

Section "Monitor"
    Identifier  "LVDS-1"
    Modeline    "1024x600_60.00"   49.00  1024 1072 1168 1312  600 603 613 624 -hsync +vsync
    Option      "PreferredMode"   "1024x600"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "Intel GMA 3150"
    Monitor     "LVDS-1"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1024x600" "800x600"
    EndSubSection
EndSection
