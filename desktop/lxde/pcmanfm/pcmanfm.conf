# PCManFM Configuration for Symbian-X86 LOOX OS
[config]
bm_open_method=0

[volume]
mount_on_startup=1
mount_removable=1
autorun=0

[desktop]
wallpaper_mode=stretch
wallpaper=/usr/share/backgrounds/symbian-loox-bg.png
desktop_bg=#1C242C
desktop_fg=#FFFFFF
desktop_shadow=#000000
desktop_font=DejaVu Sans 10
show_wm_menu=0
sort=mtime
sort_type=descending
show_documents=1
show_trash=1
show_mounts=1
